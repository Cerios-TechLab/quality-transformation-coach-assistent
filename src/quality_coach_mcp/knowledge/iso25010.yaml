# ISO/IEC 25010 Software Quality Model
framework: "ISO 25010"
version: "2023"
description: "Software product quality model with 8 quality characteristics"

domains:
  - id: "functional_suitability"
    name: "Functional Suitability"
    description: "Degree to which a product provides functions that meet stated and implied needs"
    sub_characteristics:
      - id: "functional_completeness"
        name: "Functional Completeness"
        description: "Degree to which the set of functions covers all specified tasks and user objectives"
      - id: "functional_correctness"
        name: "Functional Correctness"
        description: "Degree to which a product provides correct results with needed precision"
      - id: "functional_appropriateness"
        name: "Functional Appropriateness"
        description: "Degree to which functions facilitate the accomplishment of specified tasks"

  - id: "performance_efficiency"
    name: "Performance Efficiency"
    description: "Performance relative to the amount of resources used under stated conditions"
    sub_characteristics:
      - id: "time_behaviour"
        name: "Time Behaviour"
        description: "Response times, processing speeds, and throughput rates"
      - id: "resource_utilisation"
        name: "Resource Utilisation"
        description: "Amounts and types of resources used"
      - id: "capacity"
        name: "Capacity"
        description: "Maximum limits of a product parameter"

  - id: "compatibility"
    name: "Compatibility"
    description: "Degree to which a product can exchange information with other products"
    sub_characteristics:
      - id: "co_existence"
        name: "Co-existence"
        description: "Can perform its functions while sharing a common environment with other products"
      - id: "interoperability"
        name: "Interoperability"
        description: "Degree to which two or more systems can exchange and use information"

  - id: "usability"
    name: "Usability"
    description: "Degree to which a product can be used to achieve specified goals"
    sub_characteristics:
      - id: "recognisability"
        name: "Recognisability"
        description: "Degree to which users can identify whether product is suitable"
      - id: "learnability"
        name: "Learnability"
        description: "Degree to which product can be used to achieve learning goals"
      - id: "operability"
        name: "Operability"
        description: "Degree to which product has attributes that make it easy to operate"
      - id: "user_error_protection"
        name: "User Error Protection"
        description: "Degree to which system protects users against errors"
      - id: "ui_aesthetics"
        name: "User Interface Aesthetics"
        description: "Degree to which UI pleases the user"
      - id: "accessibility"
        name: "Accessibility"
        description: "Degree to which product can be used by people with widest range of characteristics"

  - id: "reliability"
    name: "Reliability"
    description: "Degree to which a system performs specified functions under specified conditions"
    sub_characteristics:
      - id: "maturity"
        name: "Maturity"
        description: "Degree to which system meets needs for reliability under normal operation"
      - id: "availability"
        name: "Availability"
        description: "Degree to which system is operational and accessible when required"
      - id: "fault_tolerance"
        name: "Fault Tolerance"
        description: "Degree to which system operates despite hardware or software faults"
      - id: "recoverability"
        name: "Recoverability"
        description: "Degree to which product can re-establish performance level after failure"

  - id: "security"
    name: "Security"
    description: "Degree to which product protects data and maintains functionality"
    sub_characteristics:
      - id: "confidentiality"
        name: "Confidentiality"
        description: "Data accessible only to those authorised"
      - id: "integrity"
        name: "Integrity"
        description: "Prevention of unauthorised access or modification"
      - id: "non_repudiation"
        name: "Non-repudiation"
        description: "Actions can be traced to the entity that performed them"
      - id: "accountability"
        name: "Accountability"
        description: "Actions of an entity can be traced uniquely to that entity"
      - id: "authenticity"
        name: "Authenticity"
        description: "Identity of a subject or resource can be proved"

  - id: "maintainability"
    name: "Maintainability"
    description: "Degree of effectiveness and efficiency with which a product can be modified"
    sub_characteristics:
      - id: "modularity"
        name: "Modularity"
        description: "System is composed of discrete components such that change is minimised"
      - id: "reusability"
        name: "Reusability"
        description: "Asset can be used in more than one system"
      - id: "analyisability"
        name: "Analyseability"
        description: "Effectiveness to diagnose deficiencies or causes of failures"
      - id: "modifiability"
        name: "Modifiability"
        description: "Product can be modified without introducing defects"
      - id: "testability"
        name: "Testability"
        description: "Effectiveness to establish test criteria and perform tests"

  - id: "portability"
    name: "Portability"
    description: "Degree of effectiveness of transfer of a product between environments"
    sub_characteristics:
      - id: "adaptability"
        name: "Adaptability"
        description: "Product can be effectively adapted for different environments"
      - id: "installability"
        name: "Installability"
        description: "Product can be installed and/or uninstalled in a specified environment"
      - id: "replaceability"
        name: "Replaceability"
        description: "Product can replace another specified product for the same purpose"
