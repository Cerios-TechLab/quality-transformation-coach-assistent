name: quality-transformation-coach-mcp
displayName: Quality Transformation Coach MCP Server
description: MCP server for software quality transformation coaching — 14 tools for code analysis (complexity, coverage, test patterns, flaky tests), issue/defect analysis (trends, hotspots, root causes), CI/CD health (pipeline status, test results, quality gates), and knowledge/maturity (TMMi assessments, ISO 25010 lookup, quality reporting). Embedded knowledge base with ISO 25010, TMMi, test patterns, quality gates, and recommendations.
version: "0.1.0"
author: Cerios TechLab
homepage: https://github.com/Cerios-TechLab/quality-transformation-coach-assistent
license: MIT
categories:
  - code-analysis
  - testing
  - quality-assurance
  - developer-tools
tags:
  - quality
  - testing
  - tmmi
  - iso25010
  - code-analysis
  - mcp
  - opencode
  - maturity-assessment
runtime: python
startCommand:
  type: stdio
  command:
    - python
    - -m
    - quality_coach_mcp.server
  env: {}
configSchema:
  type: object
  additionalProperties: true
  properties:
    github_token:
      type: string
      description: GitHub Personal Access Token for issue/PR/CI data
